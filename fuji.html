<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <script src="./viewport.js"></script>
  <meta name="theme-color" content="#1a1a1a">
  <meta name="description" content="Develop a Fujifilm RAF with any film simulation. Runs on your device.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="gud.pics">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>Fuji</title>
</head>
<body class="tool-body">
  <div class="tool" id="tool" data-state="empty">
    <header class="nav">
      <a class="nav-btn" href="./" aria-label="Tools"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <h1 class="nav-title">Fuji</h1>
      <button class="nav-btn" id="save" aria-label="Save" disabled><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5l5 5 5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </header>

    <section class="stage" id="stage" aria-label="Photo">
      <div class="canvas-wrap"><canvas id="canvas" aria-label="Developed photo"></canvas><img id="photo" alt="Camera JPEG" hidden></div>
      <button class="empty" id="open-empty" aria-label="Open RAF">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><circle cx="10" cy="12" r="2"/><path d="m20 17-1.296-1.296a2.41 2.41 0 0 0-3.408 0L9 22"/></svg>
        <svg class="plus" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 5v18M5 14h18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
      <div class="hud">
        <span class="chip" id="info"></span>
        <button class="compare" id="compare" aria-pressed="false" aria-label="Show camera JPEG" disabled><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v16M7 5H3v10h4M13 5h4v10h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="toast" id="status" role="status" aria-live="polite" hidden></div>
      <div class="busy" id="busy" hidden><span class="spinner"></span></div>
    </section>

    <section class="panel" aria-label="Film simulation">
      <div class="chips" id="sims" role="radiogroup" aria-label="Film simulation"></div>
      <div class="toolbar">
        <button class="tb" id="open" aria-label="Open"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="10" r="1.8" fill="currentColor"/><path d="M4 17l5-5 4 4 2.5-2.5L20 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
        <button class="tb" id="share" aria-label="Share" disabled hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v13M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </section>
    <input id="file" type="file" hidden>
  </div>

  <dialog id="save-sheet" class="sheet" aria-label="Save">
    <div class="sheet-body actions" tabindex="-1" autofocus>
      <div class="grabber"></div>
      <div class="rows">
        <button class="row" data-save="developed">Developed JPG</button>
        <button class="row" data-save="camera">Camera JPG</button>
      </div>
      <button class="cancel" data-close>Cancel</button>
    </div>
  </dialog>
  <script type="module" src="./fuji.mjs"></script>
</body>
</html>
